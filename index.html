<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#173b3a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bolívia 2026" />
    <meta name="description" content="Painel de viagem e produção da Bolívia 2026." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icon-192.png" />
    <title>Bolívia 2026</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Navegação principal">
        <div class="brand"><img src="assets/logo-pldf-com-fundo.png" alt="Pra Lá da Fronteira" /><span class="brand-trip">Bolívia<br /><strong>2026</strong></span></div>
        <nav id="desktop-nav" class="nav-list"></nav>
        <div class="crew-card"><img src="assets/foto-perfil.jpg" alt="Andressa e Paulo" /><span><b>Andressa &amp; Paulo</b><small>Expedição Bolívia</small></span></div>
        <div class="sync-note"><span class="flag-bolivia" aria-label="Bandeira da Bolívia"><i></i><i></i><i></i></span><span><b>Horário local</b><small><span id="sidebar-local-city">La Paz</span><span id="sidebar-local-time"></span></small></span></div>
      </aside>
      <div class="mobile-trip-bar"><img src="assets/logo-pldf-com-fundo.png" alt="Pra Lá da Fronteira" /><span class="flag-bolivia" aria-label="Bandeira da Bolívia"><i></i><i></i><i></i></span><img src="assets/foto-perfil.jpg" alt="Andressa e Paulo" /></div>
      <main id="app" tabindex="-1"></main>
      <nav id="mobile-nav" class="bottom-nav" aria-label="Navegação principal"></nav>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="js/data.js"></script>
    <script src="js/maps.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js"));</script>
  </body>
</html>
